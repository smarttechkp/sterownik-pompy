; Sterownik pompy - ESP32 + 10x DS18B20 + SUPLA
; Pierwsze wgranie / zmiana partycji: env "usb" -> .pio/build/usb/firmware-full.bin pod 0x0 (przez programator)
; Kolejne wgrania: env "ota" (przez WiFi), plik .bin na http://<IP>:81/update albo przycisk "Aktualizuj z GitHub" w SUPLA

; adres sterownika i haslo do /update - w secrets.ini (nie trafia do repozytorium, wzor: secrets.example.ini)
[platformio]
extra_configs = secrets.ini

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 2x 1,9 MB na program (OTA) + 128 kB na konfiguracje SUPLA (LittleFS).
; Zmiana tabeli partycji wymaga wgrania przez USB (firmware-full.bin pod 0x0)!
board_build.partitions = min_spiffs.csv
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    https://github.com/SUPLA/supla-device.git#v26.9.2

[env:usb]
upload_speed = 115200

[env:ota]
; Wgrywanie przez strone /update (HTTP). espota (ArduinoOTA) nie dziala z firmowego laptopa -
; zapora blokuje polaczenie zwrotne sterownika do komputera.
upload_protocol = custom
; port strony serwisowej - SERVICE_PORT w include/config.h
custom_port = 81
upload_command = curl.exe --noproxy * -f -sS -u ${this.custom_auth} -H "Origin: http://${this.custom_ip}:${this.custom_port}" -F "update=@$SOURCE" http://${this.custom_ip}:${this.custom_port}/update
